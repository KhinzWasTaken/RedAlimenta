[project]
name = "redalimenta-comun"
version = "0.1.0"
description = "Plantilla común de los servicios de RedAlimenta: seguridad, errores, eventos y app base"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.2",
  "PyJWT>=2.8",
  "pika>=1.3",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["redalimenta_comun"]
