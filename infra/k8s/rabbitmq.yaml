# Broker de eventos (exchange topic redalimenta.eventos).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: 5672}
    - {name: consola, port: 15672, targetPort: 15672}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: {secretKeyRef: {name: redalimenta-secretos, key: RABBITMQ_USER}}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: {secretKeyRef: {name: redalimenta-secretos, key: RABBITMQ_PASSWORD}}
          readinessProbe:
            exec: {command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 8
          livenessProbe:
            exec: {command: ["rabbitmq-diagnostics", "-q", "ping"]}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
