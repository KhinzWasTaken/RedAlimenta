# Los cinco servicios (S6-06, S6-08). catalog y fulfillment con dos réplicas y PodDisruptionBudget.
# Sondas: readiness = /salud (servicio y base listos); liveness = /vivo (proceso vivo).
---
apiVersion: v1
kind: Service
metadata:
  name: identity
spec:
  selector: {app: identity}
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
spec:
  replicas: 1
  selector:
    matchLabels: {app: identity}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: identity}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: identity
          image: redalimenta/identity:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: redalimenta-config}
          env:
            - name: APP_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: redalimenta-secretos, key: APP_DB_PASSWORD}}
            - name: RABBITMQ_USER
              valueFrom: {secretKeyRef: {name: redalimenta-secretos, key: RABBITMQ_USER}}
            - name: RABBITMQ_PASSWORD
              valueFrom: {secretKeyRef: {name: redalimenta-secretos, key: RABBITMQ_PASSWORD}}
            - name: JWT_SECRETO
              valueFrom: {secretKeyRef: {name: redalimenta-secretos, key: JWT_SECRETO}}
            - name: TOKEN_INTERNO
              valueFrom: {secretKeyRef: {name: redalimenta-secretos, key: TOKEN_INTERNO}}
            - name: DATABASE_URL
              value: postgresql+psycopg://identity_app:$(APP_DB_PASSWORD)@postgres:5432/redalimenta_identity
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/%2F
          readinessProbe:
            httpGet: {path: /salud, port: 8000}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /vivo, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
